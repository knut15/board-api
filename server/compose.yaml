# 커리큘럼 4.1 — DB 를 노트북에 설치하지 않고 컨테이너로 띄운다.
#
#   docker-compose up -d     띄운다
#   docker-compose down      멈춘다 (데이터는 남는다)
#   docker-compose down -v   볼륨까지 지운다 (데이터가 사라진다)
#
# 마지막 것을 한 번 해 보고 데이터가 같이 사라지는 것을 확인한다.
# 그게 "볼륨이 데이터를 들고 있다" 는 말의 뜻이다.
services:
  db:
    # 배포(Railway 관리형)와 메이저·마이너를 맞춘다.
    # 로컬에서 멀쩡한 것이 배포에서만 다르게 도는 일을 이미 세 번 겪었다.
    # 버전 차이를 남겨 두면 네 번째가 된다.
    image: postgres:18.6-alpine
    # 호스트 5432 를 컨테이너 5432 에 잇는다. 노트북에 Postgres 가 따로 떠 있으면 여기서 충돌한다.
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board
    # 이름 붙은 볼륨. 컨테이너를 지워도 이 볼륨이 남아 데이터가 유지된다.
    #
    # 18 부터 마운트 지점이 바뀌었다. 17 까지는 /var/lib/postgresql/data 였는데,
    # 18 이미지는 /var/lib/postgresql 아래에 메이저 버전별 디렉터리를 만든다.
    # 옛 경로에 걸면 "in 18+, these Docker images are configured to store database data
    # in a format which is compatible with pg_ctlcluster" 라며 뜨지 않는다.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
