# 문서: docs/14-verification.md · docs/15-continuous-deploy.md
#
# push 마다 검사 43가지를 돌리고, main 이면 배포까지 간다.
# 로컬에서 돌리는 것과 같은 스크립트를 쓴다 — CI 전용 검사를 따로 만들면
# 둘이 갈라지고, 갈라진 쪽은 아무도 안 고친다.

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # 로컬의 compose.yaml 과 같은 이미지다. 버전을 맞추는 이유는
    # "로컬에서는 되는데" 를 없애려는 것이고, 그건 이 레포가 이미 세 번 겪었다.
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board
          POSTGRES_DB: board
        ports: ["5432:5432"]
        # 러너에는 compose 의 healthcheck 가 없다. 여기서 같은 일을 한다 —
        # 이게 없으면 다음 단계가 아직 안 뜬 DB 에 붙으러 간다.
        options: >-
          --health-cmd "pg_isready -U board -d board"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://board:board@localhost:5432/board?schema=public
      # 검사용이다. 운영 비밀이 아니므로 값이 코드에 있어도 된다.
      # 32자 이상이어야 env.ts 의 검증을 통과한다(9.1).
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      # lib.sh 의 기본값은 컨테이너 안의 psql 을 부른다. 여기에는 compose 가 없으므로
      # 러너에 깔려 있는 psql 로 바꾼다.
      PSQL: psql postgresql://board:board@localhost:5432/board -tAc

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 타입 검사보다 먼저 와야 한다. Prisma 클라이언트는 node_modules 안에
      # **생성되는** 코드라 설치만으로는 존재하지 않고, 없으면 tsc 가
      # "@prisma/client has no exported member 'PrismaClient'" 로 멈춘다.
      # 로컬에서는 이미 생성해 둔 상태라 안 보이던 문제다 — CI 가 첫 판에 잡았다.
      - name: Prisma 클라이언트 생성
        run: pnpm --filter board-api-server exec prisma generate

      - name: 타입 검사
        run: pnpm typecheck

      - name: 린트
        run: pnpm --filter board-api-web lint

      - name: 마이그레이션
        run: pnpm --filter board-api-server exec prisma migrate deploy

      - name: 서버 띄우기
        run: |
          # 로그를 파일로 받아 둔다. 서버가 안 뜨면 이유가 거기에 있다 —
          # env.ts 가 어느 환경변수가 왜 틀렸는지 한 줄씩 찍는다(9.1).
          pnpm --filter board-api-server exec tsx src/server.ts > /tmp/server.log 2>&1 &
          # 뜰 때까지 기다린다. sleep 로 어림잡으면 느린 날 실패하고 빠른 날 낭비한다.
          for i in $(seq 30); do
            curl -sf http://localhost:4000/health > /dev/null && exit 0
            sleep 1
          done
          echo "서버가 30초 안에 뜨지 않았다. 로그:" >&2
          cat /tmp/server.log >&2
          exit 1

      - name: 검사 43가지
        run: ./scripts/verify.sh

      - name: 웹 빌드
        run: pnpm --filter board-api-web build

      # 9.8 에서 배운 것 — 실패했을 때 로그를 볼 수 없으면 원인을 못 찾는다.
      #
      # 파일이 없을 수도 있다. 서버를 띄우기 **전에** 실패하면 아직 안 만들어졌다.
      # 그때 cat 이 2로 죽으면 진짜 원인 위에 엉뚱한 실패가 하나 더 쌓인다.
      - name: 서버 로그 (실패했을 때만)
        if: failure()
        run: cat /tmp/server.log 2>/dev/null || echo "서버 로그가 없다 — 서버를 띄우기 전에 실패했다."

  # ---------------------------------------------------------------------------
  # 배포. verify 가 통과해야만 돈다.
  deploy:
    needs: verify
    # PR 에서는 돌지 않는다. main 에 실제로 들어온 것만 올린다.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # 배포는 겹치면 안 된다. 앞 배포가 끝날 때까지 기다린다 —
    # cancel-in-progress 를 켜면 마이그레이션 중간에 잘릴 수 있다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      # 토큰이 없으면 실패가 아니라 건너뛴다. 레포를 복제한 사람이
      # 남의 배포 토큰을 가질 리 없고, 그때 CI 가 빨개질 이유도 없다.
      - name: 배포 토큰이 있는지 본다
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN 이 없어 배포를 건너뛴다." >> "$GITHUB_STEP_SUMMARY"
            echo "넣는 법은 docs/15-continuous-deploy.md 에 있다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Railway CLI
        if: steps.token.outputs.has == 'true'
        run: npm install -g @railway/cli@5.60.0

      # 서버를 먼저 올린다. 마이그레이션이 여기 붙어 있어서(preDeploy) 스키마가
      # 먼저 맞춰져야 새 웹이 기대하는 응답이 나온다.
      - name: server
        if: steps.token.outputs.has == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service server --ci

      - name: web
        if: steps.token.outputs.has == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service web --ci

      # 플랫폼의 헬스체크는 컨테이너가 떴는지만 본다.
      # 전 구간이 이어졌는지는 공개 주소를 불러 봐야 안다.
      - name: 올라간 것 확인 (읽기만 한다)
        if: steps.token.outputs.has == 'true'
        run: ./scripts/smoke-deployed.sh
